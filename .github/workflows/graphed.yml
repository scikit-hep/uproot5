name: graphed

# The graphed-mvp integration. Runs the FULL uproot test suite together with the graphed tests, so
# regressions from the graphed additions (e.g. the uproot.__init__ / writing.__init__ edits) are
# caught — not just the graphed tests in isolation. Runs only on the graphed-mvp branch, so it does
# not collide with uproot's own build-test matrix (which runs on main / PRs).
on:
  push:
    branches: [graphed-mvp, m51-vary]
  workflow_dispatch:

concurrency:
  group: graphed-${{ github.ref }}
  cancel-in-progress: true

env:
  # graphed core/frontend/awkward/debug/checkpoint/preserve are now ONE consolidated package
  # (graphed.core / graphed.awkward / graphed.checkpoint / graphed.preserve). checkpoint's cloudpickle
  # is a base dep now; the [preserve] extra pulls awkward + correctionlib + onnx for the bundle tests.
  GRAPHED: "graphed[awkward,preserve] @ git+https://github.com/graphed-org/graphed@main"
  # graphed-executors stays a separate package (it depends on the consolidated graphed)
  EXEC: "graphed-executors"

jobs:
  tests:
    name: uproot + graphed tests ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff-coverage gate diffs the m51 source against origin/graphed-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install graphed (mvp) siblings + uproot (full dev group)
        run: |
          python -m pip install --upgrade pip
          # the consolidated graphed (+ exec-local, still separate) from git, so the graphed tests run
          # rather than importorskip-skip; one command so exec-local's `graphed` dep resolves to this
          # git URL rather than PyPI
          python -m pip install "${{ env.GRAPHED }}" "${{ env.EXEC }}"
          # uproot + its full test environment (PEP 735 'dev' group = 'extra' + 'test':
          # dask-awkward, hist, boost_histogram, skhep_testdata, rangehttpserver, pytest, ...)
          python -m pip install -e . --group dev
      - name: Frozen acceptance (gated pipeline)
        # The fork's frozen acceptance trees (tests/frozen/<Mx>), run in isolation for an explicit
        # green signal. --noconftest skips the ROOT tests/conftest.py, whose top-level
        # `from RangeHTTPServer import ...` is an HTTP-test dependency unrelated to these trees (the
        # frozen tests use only tmp_path + importorskip); the full-suite step below still exercises
        # that conftest and its HTTP tests, so both stay green.
        run: python -m pytest -vv tests/frozen --noconftest
      - name: Type-check the m51 graphed-integration source (mypy)
        # Scoped [tool.mypy] (pyproject): the new source + its m51 test trees, treating the untyped
        # uproot/graphed/awkward boundary as Any. Meaningful (bodies checked), not fork-wide --strict.
        run: |
          python -m pip install mypy
          python -m mypy
      - name: Diff-coverage gate (>=90% on the m51 source, from the frozen + extra suite)
        # Whole-module coverage is dragged down by pre-existing untested paths that are not m51's
        # concern, so the gate is DIFF-scoped: >=90% line+branch on the lines this branch changed in
        # _graphed_write.py. The frozen suite runs _write_partition in spawn workers (invisible to a
        # non-subprocess coverage run); the extra thread-executor test drives the same body in-process
        # so the coverage is honest. Fails if a changed line loses coverage (proven non-vacuous).
        run: |
          python -m pip install coverage
          git fetch --no-tags origin graphed-mvp:refs/remotes/origin/graphed-mvp
          python -m coverage run --branch -m pytest tests/frozen/m51 tests/extra/m51 --noconftest
          python -m coverage json -o coverage.json
          python scripts/diff_coverage_gate.py origin/graphed-mvp coverage.json \
            src/uproot/writing/_graphed_write.py
      - name: Run the full uproot suite + the graphed tests
        # The whole tests/ dir (uproot + graphed), excluding only external-infra tests this
        # lightweight job cannot provision: 'xrootd' needs a running XRootD server (upstream runs it
        # via micromamba in a dedicated job), and the s3 tests fetch a public S3 object
        # (pivarski-princeton/…picoDst.root) that is unreachable here — both are unrelated to
        # graphed. Local-http tests stay (with reruns for transient network flakes). Everything else
        # — readers, writers, dask-awkward, the graphed integration — runs, so regressions are caught.
        run: |
          python -m pytest -vv tests -m "not xrootd" -k "not xrootd and not s3" \
            --reruns 10 --reruns-delay 30 \
            --only-rerun "(?i)http|ssl|timeout|expired|connection|socket"
